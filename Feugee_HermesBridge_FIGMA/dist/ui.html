:root {
  --orange:     #f2631c;
  --orange-dim: rgba(242, 99, 28, 0.16);
  --orange-mid: rgba(242, 99, 28, 0.38);
  --blue:       #60b4e2;
  --blue-dim:   rgba(96, 180, 226, 0.16);
  --blue-mid:   rgba(96, 180, 226, 0.38);
  --danger:     #e05a49;
  --danger-dim: rgba(224, 90, 73, 0.16);
  --danger-mid: rgba(224, 90, 73, 0.38);

  --bg:         #161619;
  --card:       #1e1e22;
  --tile:       #26262c;
  --tile-hover: #33333b;
  --field:      #121215;
  --stroke:     #34343d;
  --stroke-soft:#2a2a31;

  --text:       #f1f1f4;
  --text-dim:   #b9b9c4;
  --text-muted: #7b7b88;

  --radius:     6px;
  --gap:        8px;
}

* { box-sizing: border-box; }

/* must outrank .content / .compact display:grid, otherwise hiding a view fails */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 12px/1.45 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  cursor: default;
}

/* ---------------------------------------------------------
   HEADER
   --------------------------------------------------------- */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px 8px;
  border-bottom: 1px solid var(--stroke-soft);
  background: linear-gradient(180deg, #1b1b1f 0%, var(--bg) 100%);
}

.brand-logo {
  color: #f2f2f5;
  flex: 0 0 auto;
  cursor: pointer;
  transform-origin: center center;
  animation: feugeeLogoFloat 3.8s ease-in-out infinite;
  transition: filter 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.brand-logo:hover {
  animation: none;
  transform: translateY(-1px) scale(1.1) rotate(-3deg);
  filter: drop-shadow(0 2px 10px rgba(242, 99, 28, 0.45));
}

.brand-logo:active {
  transform: scale(0.92) rotate(2deg);
}

.brand-logo.logo-pop {
  animation: feugeeLogoClickPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
}

/* Subtle periodic micro-accent on the orange & blue logo shapes */
.brand-logo .fg-l2 {
  transform-origin: 125px 145px;
  animation: feugeeOrangeIdle 5.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.brand-logo .fg-l4 {
  transform-origin: 165px 135px;
  animation: feugeeBlueIdle 5.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.brand-logo:hover .fg-l2 {
  animation: none;
  transform: scale(1.18) rotate(6deg);
}

.brand-logo:hover .fg-l4 {
  animation: none;
  transform: scale(1.18) rotate(-6deg);
}

@keyframes feugeeLogoFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-1.8px);
  }
}

@keyframes feugeeOrangeIdle {
  0%, 75%, 100% {
    transform: translateY(0) scale(1) rotate(0deg);
  }
  80% {
    transform: translateY(-2px) scale(1.12) rotate(4deg);
  }
  86% {
    transform: translateY(0.5px) scale(0.98) rotate(-1deg);
  }
  92% {
    transform: translateY(0) scale(1) rotate(0deg);
  }
}

@keyframes feugeeBlueIdle {
  0%, 78%, 100% {
    transform: translateY(0) scale(1) rotate(0deg);
  }
  83% {
    transform: translateY(1.8px) scale(1.12) rotate(-4deg);
  }
  89% {
    transform: translateY(-0.5px) scale(0.98) rotate(1deg);
  }
  95% {
    transform: translateY(0) scale(1) rotate(0deg);
  }
}

@keyframes feugeeLogoClickPop {
  0%   { transform: scale(0.9) rotate(-6deg); }
  45%  { transform: scale(1.22) rotate(4deg); }
  75%  { transform: scale(0.96) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); }
}


.brand-text { min-width: 0; }

.brand-text h1 {
  margin: 0;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  color: var(--orange);
  white-space: nowrap;
}

.brand-text p {
  margin: 1px 0 0;
  font-size: 10px;
  color: var(--blue);
  white-space: nowrap;
}

.brand-text p b {
  font-weight: 600;
  opacity: 0.75;
}

/* ---------------------------------------------------------
   DECORATIVE 8-BIT PIXEL MARQUEE TICKER
   --------------------------------------------------------- */
.feugee-ticker {
  flex: 0 0 auto;
  position: relative;
  overflow: hidden;
  height: 22px;
  display: flex;
  align-items: center;
  background-color: #0c0c0f;
  background-image:
    radial-gradient(circle at 1.5px 1.5px, rgba(242, 99, 28, 0.18) 1px, transparent 0),
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.35) 0px, rgba(0, 0, 0, 0.35) 1px, transparent 1px, transparent 2px);
  background-size: 4px 4px, 100% 2px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  border-bottom: 1px solid #000000;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 255, 255, 0.02);
  user-select: none;
  cursor: pointer;
  z-index: 5;
}

.feugee-ticker::before,
.feugee-ticker::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 24px;
  pointer-events: none;
  z-index: 2;
}

.feugee-ticker::before {
  left: 0;
  background: linear-gradient(90deg, #0c0c0f 0%, transparent 100%);
}

.feugee-ticker::after {
  right: 0;
  background: linear-gradient(270deg, #0c0c0f 0%, transparent 100%);
}

.feugee-ticker-track {
  display: flex;
  width: max-content;
  will-change: transform;
  animation: feugeePixelMarquee 50s steps(720, end) infinite;
}

.feugee-ticker:hover .feugee-ticker-track {
  animation-play-state: paused;
}

.feugee-ticker-segment {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  white-space: nowrap;
}

.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
}

.pixel-text {
  font-family: 'Silkscreen', 'Courier New', Monaco, 'SF Mono', monospace;
  font-size: 9.5px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: 1.8px;
  color: #ff853a;
  text-transform: uppercase;
  text-shadow:
    0 0 1px #f2631c,
    0 0 4px rgba(242, 99, 28, 0.7),
    0 0 8px rgba(242, 99, 28, 0.35);
  -webkit-font-smoothing: none;
  font-smooth: never;
  image-rendering: pixelated;
  animation: pixelFlicker 7s infinite;
}

.pixel-icon {
  display: inline-block;
  font-size: 10px;
  line-height: 1;
  image-rendering: pixelated;
  animation: pixelBob 0.6s steps(2) infinite;
}

.pixel-icon.icon-spark {
  color: #ffae42;
  text-shadow: 0 0 4px rgba(255, 174, 66, 0.8);
}

.pixel-icon.icon-ghost {
  font-size: 11px;
  animation: pixelBob 0.8s steps(2) infinite reverse;
}

.pixel-icon.icon-star {
  color: #60b4e2;
  text-shadow: 0 0 4px rgba(96, 180, 226, 0.8);
  animation: pixelBob 0.5s steps(2) infinite;
}

.pixel-icon.icon-bolt {
  color: #ffd244;
  text-shadow: 0 0 4px rgba(255, 210, 68, 0.8);
}

.pixel-icon.icon-heart {
  color: #ff4760;
  text-shadow: 0 0 4px rgba(255, 71, 96, 0.8);
  animation: pixelBob 0.7s steps(2) infinite;
}

.pixel-dot {
  font-size: 5px;
  color: rgba(242, 99, 28, 0.5);
  margin: 0 2px;
}

@keyframes feugeePixelMarquee {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}

@keyframes pixelBob {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2px);
  }
}

@keyframes pixelFlicker {
  0%, 93%, 100% {
    opacity: 1;
    filter: brightness(1);
  }
  94% {
    opacity: 0.88;
    filter: brightness(1.25) contrast(1.1);
  }
  95% {
    opacity: 1;
    filter: brightness(1);
  }
}

.feugee-ticker.pixel-pop {
  animation: feugeeTickerPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes feugeeTickerPop {
  0%   { transform: scaleY(0.92); filter: brightness(1.4); }
  50%  { transform: scaleY(1.08); filter: brightness(1.8) hue-rotate(-15deg); }
  100% { transform: scaleY(1); filter: brightness(1); }
}

/* ---------------------------------------------------------
   SCROLL AREA  -  this is what makes wheel scrolling work
   Card grid: column count follows panel width smoothly instead of
   jumping between fixed breakpoints.
   --------------------------------------------------------- */
.content {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding: var(--gap);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(252px, 100%), 1fr));
  gap: var(--gap);
  align-content: start;
}

.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb {
  background: #3a3a44;
  border-radius: 5px;
  border: 2px solid var(--bg);
}
.content::-webkit-scrollbar-thumb:hover { background: #4a4a57; }

/* ---------------------------------------------------------
   CARD
   --------------------------------------------------------- */
.card {
  background: var(--card);
  border: 1px solid var(--stroke-soft);
  border-radius: var(--radius);
  padding: 9px 10px 11px;
  align-self: start;
}

[data-accent="orange"] { --accent: var(--orange); --accent-dim: var(--orange-dim); --accent-mid: var(--orange-mid); }
[data-accent="blue"]   { --accent: var(--blue);   --accent-dim: var(--blue-dim);   --accent-mid: var(--blue-mid); }

.card-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 3px;
}

.card-head .bar {
  width: 3px;
  height: 13px;
  border-radius: 2px;
  background: var(--accent);
  flex: 0 0 auto;
}

.card-head .num {
  font-size: 9.5px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.card-head h2 {
  margin: 0;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.7px;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.meta {
  margin: 0 0 8px;
  font-size: 9.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------------------------------------------------------
   PARAM FIELDS
   --------------------------------------------------------- */
.params {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 12px;
  margin-bottom: 8px;
}

.field {
  display: flex;
  align-items: center;
  gap: 6px;
}

.field label {
  font-size: 9.5px;

/* ---------------------------------------------------------
   TILE GRIDS
   --------------------------------------------------------- */
.tiles      { display: grid; gap: 5px; grid-template-columns: repeat(2, 1fr); }
.tiles.solo { grid-template-columns: 1fr; }
.tiles.trio { grid-template-columns: repeat(3, 1fr); }
.tiles + .tiles { margin-top: 5px; }

.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 46px;
  padding: 7px 6px 9px;
  background: var(--tile);
  border: 1px solid var(--stroke);
  border-radius: 5px;
  color: var(--text-dim);
  font-weight: 700;
  font-size: 9px;
  line-height: 1.1;
  font-family: inherit;   /* shorthand cannot take `inherit` as the family */
  letter-spacing: 0.55px;
  text-align: center;
  overflow: hidden;
  cursor: pointer;
  transition: background 0.13s ease, border-color 0.13s ease,
              color 0.13s ease, transform 0.08s ease;
}

.tile svg { width: 20px; height: 20px; flex: 0 0 auto; }
.tile span {
  max-width: 100%;
  /* labels may wrap to a second line rather than being cut with "..." */
  white-space: normal;
  overflow-wrap: break-word;
  line-height: 1.15;
}

/* row variant: icon on the left, label on the right */
.tile.row {
  flex-direction: row;
  gap: 7px;
  min-height: 34px;
  padding: 6px 9px;
}

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

.tile.chip {
  min-height: 26px;

  font-size: 8.5px;
  background: #202026;
  border-radius: 4px;
}

.tile.danger { --accent: var(--danger); --accent-dim: var(--danger-dim); --accent-mid: var(--danger-mid); }

/* accent underline that grows on hover */
.tile::after {
  content: "";
  position: absolute;
  left: 9px;
  right: 9px;
  bottom: 3px;
  height: 2px;
  border-radius: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 0.17s cubic-bezier(0.22, 0.9, 0.3, 1);
}
.tile.chip::after { display: none; }

.tile:hover {
  background: var(--tile-hover);
  border-color: var(--accent);
  color: var(--text);
}
.tile:hover::after { transform: scaleX(1); }

  100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }

.tile.pulse { animation: fgPulse 0.45s cubic-bezier(0.2, 0.8, 0.3, 1); }

.tile.busy { opacity: 0.55; pointer-events: none; }

.tiles.right { grid-template-columns: 1fr auto; }

/* ---------------------------------------------------------

   --------------------------------------------------------- */
.check {

  height: 13px;

  border-radius: 3px;

  left: 3.5px;
  top: 0.5px;

/* segmented switch in the header */
.modes {

<footer class="statusbar">
  <i class="led" id="led"></i>
  <span id="status">Starting…</span>
</footer>

<script>
/* Feugee Hermes Bridge (Figma) - UI iframe.
   The sandbox has no network, so this iframe is the link: it long-polls the
   local relay (127.0.0.1:3846) for jobs, hands them to the sandbox, and posts
   the results back. */
(function () {
  var RELAY = "http://localhost:3846"; // Figma manifests only accept host names, not IPs
  var CLIENT = "fig-" + Math.random().toString(36).slice(2, 10);
  var info = {};
  var calls = 0, connected = null, stopped = false;
  var waiting = {}; // job id -> true

  var $ = function (id) { return document.getElementById(id); };

  // follow Figma's own theme (themeColors:true puts figma-dark/figma-light on <html>)
  function syncTheme() {
    var light = document.documentElement.classList.contains("figma-light");
    document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
    document.body.setAttribute("data-theme", light ? "light" : "dark");
  }
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
  syncTheme();

  function status(text, state) {
    $("status").textContent = text;
    $("led").className = "led" + (state === "ok" ? " ok" : state === "err" ? " err" : "");
  }
  function setConnected(on) {
    if (connected === on) return;
    connected = on;
    $("kvRelay").textContent = on ? "localhost:3846 · online" : "waiting for Hermes…";
    status(on ? "Connected · Hermes can edit this file" : "Relay offline · start any Hermes session (it starts the relay)", on ? "ok" : "err");
  }
  function renderInfo() {
    $("kvFile").textContent = info.fileName || "-";
    $("kvFile").title = info.fileKey ? "fileKey " + info.fileKey : "fileKey unavailable";
    $("kvPage").textContent = info.page || "-";
  }
  function logCall(tool, desc, ok, ms) {
    var ol = $("log");
    var empty = ol.querySelector(".hbf-empty"); if (empty) empty.remove();
    var li = document.createElement("li");
    if (!ok) li.className = "err";
    var b = document.createElement("b"); b.textContent = tool;
    var i = document.createElement("i"); i.textContent = (ok ? "" : "error · ") + ms + " ms";
    var s = document.createElement("span"); s.textContent = desc || "";
    li.appendChild(b); li.appendChild(i); if (desc) li.appendChild(s);
    ol.insertBefore(li, ol.firstChild);
    while (ol.children.length > 30) ol.removeChild(ol.lastChild);
    $("kvCalls").textContent = String(++calls);
  }

  function post(pathname, payload) {
    return fetch(RELAY + pathname, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function runJob(job) {
    waiting[job.id] = { tool: job.tool, desc: job.args && job.args.description };
    status("Running " + job.tool + "…", "ok");
    parent.postMessage({ pluginMessage: { type: "job", job: job } }, "*");
  }

  window.onmessage = function (ev) {
    var m = ev.data && ev.data.pluginMessage;
    if (!m) return;
    if (m.type === "info") { info = m.info || {}; renderInfo(); return; }
    if (m.type === "closing") { stopped = true; post("/bye", { client: CLIENT }).catch(function () {}); return; }
    if (m.type === "result") {
      var w = waiting[m.id] || {}; delete waiting[m.id];
      logCall(m.tool, w.desc, m.ok, m.ms);
      status(m.ok ? "Connected · last call " + m.tool + " " + m.ms + " ms" : "Last call failed · " + String(m.error).split("\n")[0], m.ok ? "ok" : "err");
      var payload = Object.assign({}, m); delete payload.type;
      post("/result", payload).catch(function () { status("Could not deliver result to relay", "err"); });
    }
  };

  async function loop() {
    parent.postMessage({ pluginMessage: { type: "hello" } }, "*");
    await sleep(150);
    // quick health check so the status bar flips right away (the first /poll can hold for 25 s)
    try { var h = await fetch(RELAY + "/health"); setConnected(h.ok); } catch (e) { setConnected(false); }
    while (!stopped) {
      try {
        var r = await post("/poll", { client: CLIENT, info: info });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var j = await r.json();
        setConnected(true);
        (j.jobs || []).forEach(runJob);
      } catch (e) {
        setConnected(false);
        await sleep(2000);
      }
    }
  }
  window.addEventListener("beforeunload", function () { try { navigator.sendBeacon(RELAY + "/bye", JSON.stringify({ client: CLIENT })); } catch (e) {} });
  loop();
})();

</script>
