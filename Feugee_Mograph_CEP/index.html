            <path class="fg-l2" d="M124.75,159.47c-.31-.57-.6-1.16-.86-1.76-.13.11-.25.21-.38.31-1.92,1.46-4.43,2.19-7.54,2.19-3.35,0-6.11-.74-8.28-2.23-2.18-1.49-3.78-3.53-4.8-6.11-.01-.03-.03-.07-.04-.1-.89-2.26.87-4.7,3.3-4.7h14.99c-.13-1.24-.18-2.51-.18-3.81,0-1.99.14-3.92.42-5.77h-19.38c.24-1.03.52-2.04.89-2.98,1.02-2.61,2.62-4.66,4.8-6.15,2.18-1.49,4.94-2.23,8.28-2.23,2.98,0,5.41.67,7.26,1.99.24.17.46.33.68.52.26-.57.54-1.13.84-1.67,1.39-2.65,3.12-4.99,5.16-7-1.23-.89-2.54-1.65-3.93-2.27-3.14-1.39-6.47-2.09-10.01-2.09-5.34,0-10.01,1.19-14.01,3.54-4,2.36-7.11,5.62-9.31,9.77-2.2,4.17-3.3,8.94-3.3,14.35s1.1,10.08,3.3,14.24c2.2,4.17,5.31,7.4,9.31,9.73,4,2.33,8.67,3.5,14.01,3.5,4.22,0,7.99-.77,11.32-2.29,1.06-.49,2.06-1.03,3-1.65-2.2-2.08-4.06-4.53-5.54-7.33Z"/>

          </g>
          <path class="fg-l3" d="M173.48,113.53v-1.13h4.41v1.13h-1.59v3.97h-1.24v-3.97h-1.59ZM180.29,112.4l1.09,3.47h.02l1.13-3.47h1.74v5.1h-1.2v-3.66h-.04l-1.11,3.66h-1.05l-1.09-3.66h-.04v3.66h-1.16v-5.1h1.72Z"/>

      </g>
    </g>
  </svg>
  <div class="brand-text">
    <h1>FEUGEE STUDIO</h1>
    <p>Mograph <b>v1.0.0</b></p>
  </div>
</header>

<main class="content" id="content">

  <!-- ================= 01 CLONERS ================= -->
  <section class="card" data-accent="orange">
    <div class="card-head"><i class="bar"></i><span class="num">01</span><h2>CLONERS</h2></div>
    <p class="meta" id="metaClone">Select layers to clone</p>
    <div class="params">
      <div class="field"><label for="gridX">Grid X</label><input id="gridX" type="text" value="3" data-min="1" data-max="50"></div>
      <div class="field"><label for="gridY">Grid Y</label><input id="gridY" type="text" value="3" data-min="1" data-max="50"></div>
      <div class="field"><label for="arrN">Array</label><input id="arrN" type="text" value="6" data-min="1" data-max="200"></div>
      <div class="field"><label for="linN">Linear</label><input id="linN" type="text" value="5" data-min="1" data-max="200"></div>
    </div>
    <div class="tiles trio">
      <button class="tile" data-act="create:grid" data-params="gridX,gridY" title="Arrange the selected layers in a grid. One layer is duplicated to Grid X x Grid Y first."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="3" width="4.5" height="4.5" rx="1"/><rect x="16.5" y="3" width="4.5" height="4.5" rx="1"/><rect x="3" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="16.5" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="3" y="16.5" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16.5" width="4.5" height="4.5" rx="1"/><rect x="16.5" y="16.5" width="4.5" height="4.5" rx="1"/></svg><span>GRID</span></button>
      <button class="tile" data-act="create:array" data-params="arrN" title="Arrange the selected layers on a circle. One layer is duplicated to the Array count first."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.9"/><circle cx="18.9" cy="8" r="1.9"/><circle cx="18.9" cy="16" r="1.9"/><circle cx="12" cy="20" r="1.9"/><circle cx="5.1" cy="16" r="1.9"/><circle cx="5.1" cy="8" r="1.9"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg><span>ARRAY</span></button>
      <button class="tile" data-act="create:linear" data-params="linN" title="Spread the selected layers along a line. One layer is duplicated to the Linear count first."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5 21 5.5" stroke-dasharray="1.5 2.6"/><rect x="2" y="15.5" width="4" height="4" rx="1"/><rect x="8" y="10.8" width="5" height="5" rx="1"/><rect x="15" y="3" width="6.5" height="6.5" rx="1.2"/></svg><span>LINEAR</span></button>
    </div>
    <p class="sub">Existing cloner</p>
    <div class="fgm-link">
      <select class="fgm-select" id="clonerSel" title="Cloner used by Link / Unlink. Auto = the controller you selected, or the only one in the comp"><option value="auto">Auto - selected cloner</option></select>
      <button class="tile chip" data-act="link:cloner" data-params="" title="Link the selected layers to this cloner (select its Null together with the layers, or pick it in the list)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3.1-3.1a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.1 3.1a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>LINK</span></button>
      <button class="tile chip" data-act="unlink:cloner" data-params="" title="Unlink the selected layers from the cloner - they keep where they are right now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13.5 18.8 10.2a4 4 0 0 0-5.7-5.7L11 6.6"/><path d="M8.5 10.5 5.2 13.8a4 4 0 0 0 5.7 5.7L13 17.4"/><path d="M4 4l3 3M20 20l-3-3"/></svg><span>UNLINK</span></button>
    </div>
  </section>

  <!-- ================= 02 EFFECTORS ================= -->
  <section class="card" data-accent="blue">
    <div class="card-head"><i class="bar"></i><span class="num">02</span><h2>EFFECTORS</h2></div>
    <p class="meta" id="metaEff">Select layers or properties to animate</p>
    <p class="sub">Default properties</p>
    <div class="fgm-checks">
      <label class="check"><input type="checkbox" id="afPos"><i class="box"></i>Position</label>
      <label class="check"><input type="checkbox" id="afScale" checked><i class="box"></i>Scale</label>
      <label class="check"><input type="checkbox" id="afRot"><i class="box"></i>Rotation</label>
      <label class="check"><input type="checkbox" id="afOpa"><i class="box"></i>Opacity</label>
    </div>
    <div class="tiles trio">
      <button class="tile" data-act="create:field" data-params="afPos,afScale,afRot,afOpa" title="Proximity: properties change as the field gets close. Uses selected properties, or the ticked defaults."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.8" stroke-dasharray="2.2 2.2"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg><span>FIELD</span></button>
      <button class="tile" data-act="create:step" data-params="afPos,afScale,afRot,afOpa" title="Layer order: properties change gradually from the first to the last layer."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="15" width="3.6" height="6" rx="0.8"/><rect x="8.5" y="11" width="3.6" height="10" rx="0.8"/><rect x="14" y="7" width="3.6" height="14" rx="0.8"/><path d="M4.5 10 15 3.5"/><path d="M11.5 3.2 15 3.5l-1.2 3.2"/></svg><span>STEP</span></button>
      <button class="tile" data-act="create:noise" data-params="afPos,afScale,afRot,afOpa" title="Random, looping noise on the properties - per layer."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13c2-5 3.5-5 5 0s3 5 4.5 0 3-5 4.5 0 3 4 5 0"/><circle cx="6.5" cy="5.5" r="1" fill="currentColor" stroke="none"/><circle cx="17" cy="19.5" r="1" fill="currentColor" stroke="none"/></svg><span>NOISE</span></button>
      <button class="tile" data-act="create:target" data-params="" title="Layers look at the target and get pushed away when it comes close (position + rotation)."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 1.8v4M12 18.2v4M1.8 12h4M18.2 12h4"/></svg><span>TARGET</span></button>
      <button class="tile" data-act="create:inherit" data-params="" title="Morph the selected layers between cloner formations with Morph Progress (one turn = one target)."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="3.5" height="3.5" rx="0.8"/><rect x="2.5" y="10.25" width="3.5" height="3.5" rx="0.8"/><rect x="2.5" y="16.5" width="3.5" height="3.5" rx="0.8"/><path d="M8.5 12h5"/><path d="M11.4 9.8 13.6 12l-2.2 2.2"/><circle cx="18.5" cy="12" r="3.8"/></svg><span>INHERIT</span></button>
      <button class="tile" data-act="morph" data-params="" title="Add a Morph Target slot to the selected Inherit controller. Select a cloner too to fill it in."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="6"/><path d="M9 9v6M6 12h6"/><path d="M17 6.5c2.4 1.2 4 3.3 4 5.5s-1.6 4.3-4 5.5"/></svg><span>MORPH TARGET</span></button>
    </div>
    <p class="sub">Existing effector</p>
    <div class="fgm-link">
      <select class="fgm-select" id="effSel" title="Effector used by Link / Unlink. Auto = the controller you selected, or the only one in the comp"><option value="auto">Auto - selected effector</option></select>
      <button class="tile chip" data-act="link:effector" data-params="afPos,afScale,afRot,afOpa" title="Link the selected layers / properties to this effector"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3.1-3.1a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.1 3.1a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>LINK</span></button>
      <button class="tile chip" data-act="unlink:effector" data-params="" title="Unlink the selected layers / properties from the effector - the current look is kept"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13.5 18.8 10.2a4 4 0 0 0-5.7-5.7L11 6.6"/><path d="M8.5 10.5 5.2 13.8a4 4 0 0 0 5.7 5.7L13 17.4"/><path d="M4 4l3 3M20 20l-3-3"/></svg><span>UNLINK</span></button>
    </div>
  </section>

  <!-- ================= 03 RIG TOOLS ================= -->
  <section class="card" data-accent="orange">
    <div class="card-head"><i class="bar"></i><span class="num">03</span><h2>RIG TOOLS</h2></div>
    <p class="meta" id="metaTools">Select a controller or linked layers</p>
    <div class="tiles trio">
      <button class="tile" data-act="select" data-params="" title="Controller selected: select its layers. Layers + one property: select that property on all of them. Linked layers: select their controllers."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12v-1M20 12v-1M12 4h-1M12 20h-1"/><path d="m10 9 6 3.2-2.7.8 1.7 3-1.4.8-1.7-3L10 15.5z" fill="currentColor" stroke="none"/></svg><span>SELECT</span></button>
      <button class="tile" data-act="copy" data-params="" title="Duplicate the selected controllers with their layers, rewired to the copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg><span>COPY</span></button>
      <button class="tile" data-act="organize" data-params="" title="Move clones back under their controller, colour-code each rig, repair switched-off rig expressions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="8" height="4" rx="1"/><path d="M6 7.5v13"/><rect x="9" y="10" width="12" height="3.5" rx="1"/><rect x="9" y="16.5" width="12" height="3.5" rx="1"/><path d="M6 11.75h3M6 18.25h3"/></svg><span>ORGANIZE</span></button>
      <button class="tile" data-act="bake" data-params="bakeWA" title="Turn the rig into plain keyframes and remove its controllers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5 9 12l-3 3.5L3 12z"/><path d="M15 8.5 18 12l-3 3.5L12 12z"/><path d="M3.5 20.5h17"/><path d="M12 3.5v2.5"/><path d="M10.2 4.8 12 6.6l1.8-1.8" /></svg><span>BAKE</span></button>
      <button class="tile danger" data-act="clean" data-params="" title="Remove the rig, keep the current static look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 4.5 5 5-8.5 8.5H6l-2.5-2.5z"/><path d="M9 10l5 5"/><path d="M11 20.5h9.5"/></svg><span>CLEAN</span></button>
      <button class="tile" data-act="sample" data-params="" title="Build a demo comp: grid + field + noise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M10 9v6l5-3z" fill="currentColor" stroke="none"/></svg><span>SAMPLE</span></button>
    </div>
    <label class="check fgm-gap"><input type="checkbox" id="bakeWA" checked><i class="box"></i>Bake the work area only</label>
  </section>

  <!-- ================= 04 IN THIS COMP ================= -->
  <section class="card" data-accent="blue">
    <div class="card-head"><i class="bar"></i><span class="num">04</span><h2>IN THIS COMP</h2></div>
    <p class="meta" id="metaList">No composition open</p>
    <div class="fgm-list" id="ctrlList"></div>
  </section>

</main>

<footer class="statusbar">
  <i class="led" id="led"></i>
  <span id="status">Loading host script...</span>
</footer>

<script src="js/panel.js"></script>
<script src="js/modes.js"></script>
</body>
</html>
